# The whole example: Kafka, the bank's services, the agent served by `domyn serve`, and
# the analyst's console on http://localhost:8080, where the alerts are sent from.
#
#   docker compose up
#
# The terminal then shows the console's log, one line for each thing the agent does, and
# the warnings and errors of the others. Kafka's own log stays out of it:
# `docker compose logs kafka`.
#
# The image is built from this checkout of the repository (see Dockerfile). Every port is
# published on this machine only: the console has no login, and anyone who reaches it can
# approve a payment.

x-example: &example
  build:
    context: ../..
    dockerfile: examples/fraud-alerts/Dockerfile
  image: domyn-fraud-alerts
  environment:
    KAFKA_BOOTSTRAP: kafka:29092
    SERVICES_URL: http://services:8001

services:
  # One broker. localhost:9092 for this machine, kafka:29092 for the other containers.
  kafka:
    image: apache/kafka:3.9.1
    attach: false  # its log is not the example's
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 5s
      retries: 20

  # The bank's services, with made-up data, as REST and as MCP tools.
  services:
    <<: *example
    command: python services.py
    environment:
      LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/alerts/A-1001')"
      interval: 3s
      retries: 20

  # The agent: `domyn serve` with the Kafka channel in config.yaml.
  agent:
    <<: *example
    # Warnings and errors only: what the agent does is in the console's log.
    command: domyn --log-level WARNING serve config.yaml --channel multi
    env_file: .env  # your OPENROUTER_API_KEY: copy .env.example
    depends_on:
      kafka: {condition: service_healthy}
      services: {condition: service_healthy}

  # The analyst's console, in the browser: http://localhost:8080
  console:
    <<: *example
    command: python console.py
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SERVICES_URL: http://services:8001
      LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka: {condition: service_healthy}
      services: {condition: service_healthy}
