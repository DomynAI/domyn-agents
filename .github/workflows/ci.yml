name: CI Tests

on:
  push:
    branches:
      - main  # Triggers on push to main only
  # Every pull request, with no path filter: `test` is a required check, and a
  # workflow a filter never starts leaves a required check waiting forever. The
  # job `changes` decides instead, and a job it skips counts as passed.
  pull_request:
    branches:
      - '**'  # Triggers on PRs to any branch
  # From release.yml: a tag is tested on every version before anything is
  # published.
  workflow_call:

# Named rather than ${{ github.workflow }}: called from release.yml that is
# "Release" for every workflow it calls, and they would share one group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether a pull request changes anything the tests read. Not a change
  # confined to docs/ (built by docs.yml) or scripts/, except the files there
  # that tests read: the pages and the sidebar, which the index of the
  # domyn-docs skill is checked against, and the scripts with tests. The
  # examples are code: linted, and loaded by examples/test_examples.py.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
          persist-credentials: false

      - name: Changed files
        id: files
        run: |
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/docs/*|docs/sidebars.js) code=true ;;
              scripts/publish_docs_version.py|scripts/release_notes.py|scripts/tag_release.py) code=true ;;
              scripts/prune_alpha_releases.py|scripts/coverage_total.py) code=true ;;
              docs/*|scripts/*) ;;
              *) code=true ;;
            esac
            echo "$file"
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Pull requests only: on main the job below runs the same tests on every
  # supported version, the one in .python-version included. A required check,
  # with the coverage of the change checked here too, on the Linux and the
  # Windows runs together: code that runs only on Windows is covered there, and
  # it waits for the Intel Windows job, which writes that report (ARM's runs
  # beside it, without one). Run whatever that job ends in.
  test:
    needs: [changes, test-windows]
    if: >-
      !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # the coverage-exempt label, read when the job runs

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover compares with the base branch.
          fetch-depth: 0
          persist-credentials: false

      # uv runs on the version in .python-version, so install that one.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          
      - name: Install dependencies
        # Bytecode for the package and the tests, compiled once here rather than
        # by each worker as it imports: the run starts from a fresh checkout, so
        # nothing is cached and every worker paid for the same 500 modules.
        env:
          UV_COMPILE_BYTECODE: 1
        run: uv sync --all-extras

      - name: Lint code
        run: |
          make lint

      - name: Format Check code
        run: |
          make format-check

      - name: Run tests
        run: |
          make test

      # Read from the API, not the event: "Re-run jobs" replays the event as it
      # was, so a label a maintainer adds afterwards would never be seen.
      - name: Check for a coverage exemption
        id: exempt
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx coverage-exempt; then
            echo "exempt=true" >> "$GITHUB_OUTPUT"
            echo "⚪ Coverage not checked: the pull request is labelled \`coverage-exempt\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Missing when the Windows tests did not get as far as writing it.
      - name: Windows coverage
        if: steps.exempt.outputs.exempt != 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-windows

      # The lines the pull request adds or changes, at least 80% of them run by
      # a test, on Linux or on Windows: diff-cover counts a line covered in
      # either report. The uncovered ones are listed in the job summary.
      - name: Coverage of the change
        if: steps.exempt.outputs.exempt != 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          reports=(coverage.xml)
          if [ -f coverage-windows.xml ]; then
            # Its files are named from the Windows checkout (D:\a\...), which
            # matches nothing here: from the package folder, as diff-cover reads them.
            sed -E -i 's#<source>[^<]*</source>#<source>domyn</source>#' coverage-windows.xml
            reports+=(coverage-windows.xml)
          else
            echo "⚠️ No Windows coverage: the lines that run only on Windows count as not covered." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          uv run diff-cover "${reports[@]}" --compare-branch "origin/$BASE" \
            --fail-under 80 --format "markdown:$RUNNER_TEMP/diff-cover.md" \
            && status=0 || status=$?
          cat "$RUNNER_TEMP/diff-cover.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # The total may not drop below main's (coverage-total.txt on the
      # coverage-badge branch, written with the badge), save for noise.
      - name: Total coverage against main
        if: steps.exempt.outputs.exempt != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline=$(gh api "repos/$GITHUB_REPOSITORY/contents/coverage-total.txt?ref=coverage-badge" \
            --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ -z "$baseline" ]; then
            echo "⚪ No total recorded on main yet: not compared." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/coverage_total.py compare coverage.xml --baseline "$baseline" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  # Windows, Intel and ARM, on the version in .python-version. Commands run in
  # Git Bash (Git for Windows, preinstalled on the runners), as they do for a
  # user. Pull requests and main alike: a change that breaks Windows is caught
  # before it is merged.
  test-windows:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    name: test-windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Intel's run writes the coverage the test job checks, in pull requests.
      COVERAGE_REPORT: ${{ github.event_name == 'pull_request' }}
      PYTHON_ARCH: x86_64

    # The same steps on ARM below (a YAML anchor): two jobs rather than a matrix,
    # so the test job can wait for this one alone, which has the coverage, while
    # ARM runs beside it. Its check is still required.
    steps: &windows-steps
      # Defender's real-time scan opens every file written and every program
      # started, and the suite does both by the thousand: a checkout, uv's
      # installs, a Git Bash per command. The runner is thrown away after the job.
      - name: Turn off Defender's real-time scan
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cache keyed by Python's architecture too: its key names the runner's
      # (aarch64 on ARM) whatever Python runs there, so the ARM job restored the
      # cache of its earlier, emulated x64 runs, and as an existing key is never
      # saved again, the ARM64 wheels it built were lost on every run.
      - name: Install uv
        id: uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-suffix: ${{ env.PYTHON_ARCH }}

      # The machine's own Python, as the standalone build of each runs: x64 on
      # Intel, ARM64 on ARM. uv's build of the version in .python-version, which
      # uv sync downloads in seconds (setup-python spent two minutes on ARM).
      - name: Use the machine's Python
        shell: bash
        run: |
          version="$(tr -d '\r\n ' < .python-version)"
          echo "UV_PYTHON=cpython-${version}-windows-${PYTHON_ARCH}-none" >> "$GITHUB_ENV"

      # On ARM, cryptography, pdf-inspector, firecrawl-anydoc and tiktoken have no
      # win_arm64 wheel, and uv sync builds them from their sdists, as the arm64
      # standalone build does (scripts/build_standalone.sh): Rust, the Build
      # Tools' Clang (for ring, which pdf-inspector uses) and OpenSSL. Only when
      # uv.lock changes: setup-uv keeps the wheels uv built in its cache (its
      # `uv cache prune --ci` drops the downloaded ones only), so later runs
      # build nothing, and these two steps are skipped when that cache is there.
      # OpenSSL is kept as vcpkg's binary cache, six minutes to build once. The
      # runner's image has Rust and the Clang component already: the step adds
      # them only for an image that lacks them.
      - name: Cache OpenSSL for arm64
        if: ${{ env.PYTHON_ARCH == 'aarch64' && steps.uv.outputs.cache-hit != 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-openssl-arm64-windows-static-md-v1

      - name: Rust, Clang and OpenSSL for arm64
        if: ${{ env.PYTHON_ARCH == 'aarch64' && steps.uv.outputs.cache-hit != 'true' }}
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl -fsSL -o "$RUNNER_TEMP/rustup-init.exe" \
              https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          installer="/c/Program Files (x86)/Microsoft Visual Studio/Installer"
          vs="$("$installer/vswhere.exe" -latest -products '*' -property installationPath | tr -d '\r')"
          clang="$(cygpath -u "$vs")/VC/Tools/Llvm/ARM64/bin"
          if [ ! -x "$clang/clang.exe" ]; then
            "$installer/setup.exe" modify --installPath "$vs" --quiet --norestart \
              --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 \
              --add Microsoft.VisualStudio.Component.VC.Llvm.Clang
          fi
          cygpath -w "$clang" >> "$GITHUB_PATH"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:arm64-windows-static-md
          echo "OPENSSL_DIR=$VCPKG_INSTALLATION_ROOT\installed\arm64-windows-static-md" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      # On ARM, when uv builds the packages above: one at a time, and once more
      # after a failure, which starts where it stopped (what was built is in uv's
      # cache). Building them all at once, pyo3's build script, which runs Python
      # to read its configuration, failed once on the runner with "Bad file
      # descriptor" writing to stdout, a run after the same build had passed.
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$PYTHON_ARCH" = aarch64 ]; then
            export UV_CONCURRENT_BUILDS=1
            uv sync --all-extras || { echo "::warning::uv sync failed, trying once more"; uv sync --all-extras; }
          else
            uv sync --all-extras
          fi

      # A test that hangs is ended after two minutes and named, with its stack,
      # rather than holding the job until its timeout with nothing to show:
      # waiting on a process that never exits is how a POSIX assumption fails
      # here. -rfE lists every failure and error at the end, by name.
      # UTF-8 on the standard streams only: on the runner's cp1252 console, the
      # first failure whose text has a character outside it (the banner art)
      # ended pytest silently in the middle of its summary. Not PYTHONUTF8,
      # which would also make every file read without an encoding read UTF-8
      # and hide the very bugs this job is here to find.
      # Coverage measured through sys.monitoring (COVERAGE_CORE=sysmon, Python
      # 3.12+), which costs a fifth of the default tracer: on the tests that time
      # themselves, +12% against +57% (measured on Windows on ARM, x64 emulated).
      # Eight workers on the runner's four cores: the slowest tests (background
      # commands under Git Bash) mostly wait, so twice as many overlap their
      # waits. worksteal hands a free worker the tests still queued on a busy one,
      # so a 15 s test drawn last does not hold the job on one worker.
      - name: Run tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          COVERAGE_CORE: sysmon
          COVERAGE: >-
            ${{ env.COVERAGE_REPORT == 'true'
            && '--cov=domyn --cov-report=xml:coverage-windows.xml' || '--no-cov' }}
        run: >-
          uv run --with pytest-timeout pytest tests/ examples/ -q $COVERAGE
          -p no:cacheprovider --timeout=120 -rfE -n 8 --dist worksteal

      # Written even when a test failed, so the coverage check still has it.
      - name: Upload coverage
        if: ${{ !cancelled() && env.COVERAGE_REPORT == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-windows
          path: coverage-windows.xml
          retention-days: 1
          if-no-files-found: ignore

  test-windows-arm:
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    name: test-windows (windows-11-arm)
    runs-on: windows-11-arm
    # Room for a run after uv.lock changed: OpenSSL and four packages compiled
    # (some fifteen minutes) before the tests. Others take what Intel's does.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COVERAGE_REPORT: false
      PYTHON_ARCH: aarch64
    steps: *windows-steps

  # Every Python version the package supports (pyproject.toml's classifiers,
  # and the Python badge in the README). On main and on release tags (called
  # from release.yml, where the event is the tag's push, or the dispatch of a
  # nightly alpha): pull requests run the job above, on the version in
  # .python-version.
  test-python-versions:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushes the coverage badge to the coverage-badge branch (from main only).
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    env:
      # Without it uv takes the version in .python-version over the one below.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The coverage badge is pushed back to the repository at the end.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          # Puts the version in the cache key. Without it every version but the
          # one in .python-version got the same key, the first to finish saved
          # its cache for all of them, and 3.15 rebuilt its source-only
          # packages (zstandard, pydantic-core...) on every run.
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # The coverage badge is measured on main, on the version in
      # .python-version, the one pull requests are tested on.
      - name: Check for the badge version
        id: badge
        run: echo "enabled=$([ "$GITHUB_REF" = refs/heads/main ] && [ "$(cat .python-version)" = "${{ matrix.python-version }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.badge.outputs.enabled != 'true'
        run: make test-no-cov

      - name: Run tests with coverage
        if: steps.badge.outputs.enabled == 'true'
        run: make test

      # The total beside it is the baseline pull requests are compared with.
      - name: Generate coverage badge
        if: steps.badge.outputs.enabled == 'true'
        run: |
          uv run genbadge coverage -i coverage.xml -o coverage-badge.svg
          python3 scripts/coverage_total.py total coverage.xml > coverage-total.txt
          cat coverage-total.txt

      - name: Commit and push coverage badge
        if: steps.badge.outputs.enabled == 'true'
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "ci: update coverage badge [skip ci]"
          file_pattern: coverage-badge.svg coverage-total.txt
          branch: coverage-badge
          create_branch: true
          push_options: "--force"
