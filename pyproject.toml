[project]
name = "domyn"
# From the git tag (vX.Y.Z), read at build time by hatch-vcs: see [tool.hatch.version].
dynamic = ["version"]
description = "Build AI agents in Python or YAML, run them on any model, and work with them from the terminal."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Domyn", email = "agents@domyn.com"}
]
license = {text = "Apache-2.0"}
keywords = ["ai", "agents", "llm", "framework", "registry", "ioc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
    "httpx2>=2.13.0",
    "pyyaml>=6.0.0",
    "nest-asyncio>=1.6.0",
    "fastmcp>=4.1.2,<5.0.0",
    "aiosqlite>=0.21.0",
    "fastapi>=0.121.3",
    "python-ulid>=3.1.0",
    "typer>=0.24.1",
    "rich>=13.0.0",
    # The CLI renders markdown with it (interfaces/cli/markdown.py). Already
    # installed as a dependency of rich; declared because it is imported directly.
    "markdown-it-py>=2.2.0",
    "tomlkit>=0.15.1",
    "websockets>=13.0",
    "cashews>=3.0.0",
    "python-dotenv>=1.0.0",
    # read_file converts PDF and Office documents to markdown. One wheel with
    # no dependencies of its own, built for macOS, Linux and Windows.
    "firecrawl-anydoc>=0.2.4,<0.3",
    # A PDF is read page by page with anydoc's own PDF engine, so a page with
    # no text is named instead of vanishing or stopping the whole document.
    "pdf-inspector>=1.25.2,<2",
]

[project.urls]
Homepage = "https://github.com/domynai/domyn-agents"
Documentation = "https://domynai.github.io/domyn-agents/"
Repository = "https://github.com/domynai/domyn-agents"
Issues = "https://github.com/domynai/domyn-agents/issues"

[tool.pytest.ini_options]
addopts = "-n auto"

[dependency-groups]
dev = [
    "mypy>=1.17.1,<3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.6.1",
    "respx>=0.22.0",
    "aiohttp>=3.14.1",
    "genbadge[coverage]",
    "jsonschema>=4.25.1",
    "ruff>=0.15.12",
    "diff-cover>=10.6.0",
    # Run by the built-in data skills' scripts, which tests/skills executes.
    "numpy>=2.3.5",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]
langchain = [
    "langchain>=1.0.0",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.0.0",
]
langgraph = [
    "langchain-core>=1.3.3",
    "langgraph>=1.0.0",
    "websockets<18",
]
telegram = [
    "python-telegram-bot>=21.0",
]
slack = [
    "slack-bolt>=1.20.0",
    "slack-sdk>=3.27.0",
]
cli = [
    "prompt-toolkit>=3.0.50",
]
# Local speech to text (domyn.agents.audio.LocalTranscriber). onnxruntime has no
# wheel for Python 3.15 yet: there the extra installs nothing, and the local
# transcriber says so when used.
audio = [
    "onnx-asr[cpu,hub]>=0.12.0; python_version < '3.15'",
    # The microphone, for `domyn run --voice`. Bundles PortAudio on macOS and
    # Windows; Linux needs libportaudio2 from the system.
    "sounddevice>=0.5.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is the release tag: a build at v1.7.0 is 1.7.0, one five commits
# later 1.7.1.dev5+g<hash>. No file holds it and no commit bumps it; a release is
# a tag (`make release-patch`, see AGENTS.md). The fallback is for a tree with
# no git history (a source archive); an sdist carries its version in PKG-INFO.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build]
exclude = [
    ".domyn",
    ".vscode",
    ".github",
    "docs",
]

[tool.hatch.build.targets.wheel]
packages = ["domyn"]

# The pages of the documentation site ship with the package, for the domyn-docs
# skill: in the repository its `pages` is a symlink to docs/docs, which a wheel
# built from the tree follows. An sdist would keep the symlink, pointing at
# nothing, so the pages go in as files at the same place; `uv build` builds the
# wheel from it. The site's own tooling (docs/package.json, ...) stays out.
[tool.hatch.build.targets.sdist]
# The build-wide list again (a target's own replaces it), plus the symlink, so the
# pages are in the sdist once, from force-include.
exclude = [
    ".domyn",
    ".vscode",
    ".github",
    "docs",
    "domyn/agents/skills/builtin/cli/domyn-docs/pages",
]

[tool.hatch.build.targets.sdist.force-include]
"docs/docs" = "domyn/agents/skills/builtin/cli/domyn-docs/pages"

[tool.ruff]
line-length = 100
extend-exclude = [
    "__pycache__",
    ".venv",
    "build",
    "dist",
    # The documentation pages, through the domyn-docs symlink: their code blocks
    # are formatted for reading.
    "domyn/agents/skills/builtin/cli/domyn-docs/pages",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    # Docstrings: only the rules that catch noise, not a style. D401/D205 would
    # fight the repo's descriptive prose, and D1xx would demand docstrings.
    "D200", # a one-line docstring split over several lines
    "D301", # a backslash in a docstring that is not raw: \n renders as a newline
    "D419", # an empty docstring
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]  # Allow unused imports in tests
# Scripts shipped inside skills: data-science naming (X_train) and typographic
# characters (−, ×, —) in text written for human readers are intentional.
"domyn/agents/skills/builtin/**/scripts/*" = ["N803", "N806", "RUF001", "RUF002"]
# Modules and scripts those skills share, one level above them (builtin/data/*.py), and
# the chart styles every builtin skill shares (builtin/resources/seaborn_style.py and
# plotly_style.py).
"domyn/agents/skills/builtin/*/*.py" = ["N803", "N806", "RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = ["classmethod", "pydantic.field_validator"]

[tool.mypy]
python_version = "3.11"
# Scripts shipped inside skills run in the agent's environment against libraries that
# are not dependencies of this package (pandas, scikit-learn, catboost), and are
# not importable modules of it (their directory names contain hyphens). The modules and
# scripts they share (builtin/data/*.py) are run the same way, and so is the chart style
# in builtin/resources/ (seaborn_style.py, which needs seaborn, and plotly_style.py, which
# needs plotly).
exclude = [
    '^domyn/agents/skills/builtin/.*/scripts/',
    '^domyn/agents/skills/builtin/[^/]+/[^/]+\.py$',
]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = false
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true


# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# External libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "domyn_platform_sdk.*",
    "yaml.*",
    "telegram.*",
    "slack_bolt.*",
    "slack_sdk.*",
    # Optional, and not installable on 3.15 (the audio extra).
    "onnx_asr.*",
    "onnxruntime.*",
    "sounddevice.*",
]
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "domyn.agents.adapters.*"
warn_unreachable = false


[project.scripts]
domyn = "domyn.agents.cli.main:cli"

[tool.coverage.run]
omit = ["examples/*", 'tests/*']
# A PDF is read in a child process (domyn/agents/scripts/pdf_reader.py), which
# the tests run but coverage measures only when told to follow subprocesses.
patch = ["subprocess"]
